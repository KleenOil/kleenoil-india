# Full local stack (PostgreSQL + Next.js app) — optional.
# Usage: docker compose -f docker/docker-compose.full.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: industrial_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-industrial_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-industrial_platform}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: industrial_platform_app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-industrial_platform}
      NODE_ENV: development
    volumes:
      - ..:/app
      - /app/node_modules
      - ../media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: industrial_platform_postgres_data
