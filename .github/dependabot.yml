# Dependabot configuration — automated dependency update pull requests
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # npm dependencies (production + dev)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      # Group minor/patch dev tooling updates to reduce PR noise
      dev-dependencies:
        patterns:
          - '@types/*'
          - 'eslint*'
          - 'prettier*'
          - 'vitest*'
          - '@playwright/*'
          - '@testing-library/*'
          - 'husky'
          - 'lint-staged'
          - '@commitlint/*'
        update-types:
          - minor
          - patch
      payload:
        patterns:
          - 'payload'
          - '@payloadcms/*'
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
      include: scope

  # Docker base images (when docker/ is added in Phase 1)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
      include: scope
